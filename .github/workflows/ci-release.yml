name: CI and versioned releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-build:
    name: ${{ matrix.os }} checks & build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
            binary: target/release/pc_activity_scanner
          - os: windows-2025
            artifact: windows-x86_64
            binary: target/release/pc_activity_scanner.exe
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Test release packaging
        run: python -m unittest discover -s scripts -p test_release.py
      - name: Validate release version and main ancestry
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python scripts/release.py validate "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Ubuntu desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libssl-dev pkg-config xvfb xauth xdotool libxcursor1 libxi6 libgl1 libgl1-mesa-dri libegl1 libxkbcommon-x11-0
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run unit tests
        run: cargo test --all-targets --locked
      - name: Windows startup configuration integration
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          PC_ACTIVITY_SCANNER_CI_TASK_TEST: '1'
        run: cargo test --all-targets --locked disposable_ci_ -- --ignored --nocapture --test-threads=1
      - name: Release build
        run: cargo build --release --locked
      - name: Windows ETW TCP UDP runtime smoke test
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/target/release/pc_activity_scanner.exe" -ArgumentList '--windows-network-smoke-test' -PassThru -Wait -NoNewWindow -RedirectStandardOutput 'target/windows-network-smoke.log' -RedirectStandardError 'target/windows-network-smoke-error.log'
          Get-Content target/windows-network-smoke.log
          Get-Content target/windows-network-smoke-error.log
          if ($process.ExitCode -ne 0) { throw "Windows ETW smoke failed: $($process.ExitCode)" }
      - name: Linux desktop startup smoke test
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 30s xvfb-run -a bash scripts/smoke-linux.sh
      - name: Stage executable
        shell: bash
        run: |
          mkdir -p dist
          cp '${{ matrix.binary }}' 'dist/pc_activity_scanner-${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish versioned release
    needs: [verify-and-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*-x86_64'
          path: dist
          merge-multiple: true
      - name: Package executables and generate checksums
        run: python scripts/release.py package "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "PC Activity Scanner $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --latest release-assets/*
