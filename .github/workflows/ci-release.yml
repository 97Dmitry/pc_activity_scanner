name: CI and per-commit release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-build:
    name: ${{ matrix.os }} checks & build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x86_64
            binary: target/release/pc_activity_scanner
          - os: windows-2025
            artifact: windows-x86_64
            binary: target/release/pc_activity_scanner.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Ubuntu desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libssl-dev pkg-config xvfb xauth xdotool libxcursor1 libxi6 libgl1 libgl1-mesa-dri libegl1 libxkbcommon-x11-0
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run unit tests
        run: cargo test --all-targets --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Linux desktop startup smoke test
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 30s xvfb-run -a bash scripts/smoke-linux.sh
      - name: Stage executable
        shell: bash
        run: |
          mkdir -p dist
          cp '${{ matrix.binary }}' 'dist/pc_activity_scanner-${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Snapshot release for every main push
    needs: [verify-and-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-x86_64'
          path: dist
          merge-multiple: true
      - name: Generate SHA256 manifest
        shell: bash
        run: |
          cd dist
          sha256sum pc_activity_scanner-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: 'PC Activity Scanner — build ${{ github.run_number }}'
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
