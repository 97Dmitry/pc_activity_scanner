[package]
name = "pc_activity_scanner"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
description = "Native Rust desktop process and resource monitor"
license = "MIT"
repository = "https://github.com/97Dmitry/pc_activity_scanner"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "=0.37.0"
sysinfo = "=0.40.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }

csv = "1.4"
tempfile = "3.27"
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "cache"] }
chrono = "0.4.45"

[build-dependencies]
winresource = "=0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.bundle]
name = "PC Activity Scanner"
identifier = "dev.97dmitry.pc-activity-scanner"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
